name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.12'}
          - {os: windows-latest, python: '3.10'}
          - {os: windows-latest, python: '3.14'}
    steps:
      # Pins resolved from the official actions repositories on 2026-10-07.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit and boundary tests
        run: python -m unittest discover -s tests -v
      - name: Check public package sources
        run: python tools/check.py
      - name: Run deterministic scenarios
        run: python tools/evaluate.py
      - name: Build release archives
        run: python tools/package.py
      - name: Verify release contents and checksums
        run: python tools/check.py --archives dist
