name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pins resolved from the official actions repositories on 2026-10-07.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test and check public sources
        run: |
          python -m unittest discover -s tests -v
          python tools/check.py
          python tools/evaluate.py
          python tools/package.py
          python tools/check.py --archives dist
      - name: Add verified downloads to the site artifact
        run: python -c "from pathlib import Path; import shutil; target = Path('site/downloads'); target.mkdir(parents=True, exist_ok=True); [shutil.copyfile(p, target / p.name) for p in Path('dist').iterdir() if p.suffix == '.zip' or p.name == 'SHA256SUMS']"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
